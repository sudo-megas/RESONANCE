name: Release

# push:tags is the real release trigger; workflow_dispatch exists purely as
# a dry-run — it runs build + both packaging jobs on real GitHub Actions
# infrastructure without ever calling `gh release create` (see the `release`
# job's `if:` below). Go/Wails CLI are pinned to go.mod's exact versions;
# every third-party Action below is pinned to a full commit SHA, never a
# floating tag — resolved by hand against each action's real tag history at
# the time this file was written, not from memory.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GO_VERSION: "1.25.0"
  WAILS_VERSION: "v2.14.0"
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        run: wails build -tags webkit2_41 -platform linux/amd64

      # The helper is a second main package and wails knows nothing about
      # it, so it gets its own build — after the app's, because wails
      # clears build/bin. Both packaging jobs install it, and without it
      # putting a file back into /etc or /usr cannot work.
      - name: Build privileged helper
        run: go build -trimpath -ldflags="-w -s" -o build/bin/resonance-helper ./cmd/resonance-helper

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resonance-linux-amd64
          path: build/bin/
          retention-days: 1

  package-deb:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resonance-linux-amd64
          path: artifact

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble .deb
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -e
          ROOT="pkgroot"
          install -Dm755 artifact/resonance "$ROOT/usr/bin/resonance"
          # Not /usr/bin: the helper is not a program to run, it is what
          # pkexec runs on RESONANCE's behalf. The policy file authorises
          # this exact path, and --root-owner-group below is what makes it
          # root-owned in the package — pkexec refuses a helper that is not.
          install -Dm755 artifact/resonance-helper "$ROOT/usr/lib/resonance/resonance-helper"
          install -Dm644 build/packaging/xyz.namli.resonance.policy "$ROOT/usr/share/polkit-1/actions/xyz.namli.resonance.policy"
          install -Dm644 build/packaging/resonance.desktop "$ROOT/usr/share/applications/resonance.desktop"
          for size in 32 48 64 128 256 512; do
            install -Dm644 "build/icons/${size}.png" "$ROOT/usr/share/icons/hicolor/${size}x${size}/apps/resonance.png"
          done
          mkdir -p "$ROOT/DEBIAN"
          sed "s/^Version:.*/Version: ${VERSION}/" build/packaging/control > "$ROOT/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$ROOT" "resonance_${VERSION}_amd64.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resonance-deb
          path: "*.deb"
          retention-days: 1

  package-arch:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resonance-linux-amd64
          path: build/bin

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Arch's pkgver may not contain colons, forward slashes,
            # hyphens or whitespace -- unlike the .deb job's version
            # string, this one goes straight into a sed substitution
            # of PKGBUILD's pkgver= line, so a real tag using a
            # hyphenated pre-release suffix (e.g. v1.0.1-rc1) must be
            # sanitized here too, not just the dry-run fallback below.
            RAW="${GITHUB_REF_NAME#v}"
            echo "value=$(printf '%s' "$RAW" | tr -c 'A-Za-z0-9._' '_')" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Arch package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -e
          chmod +x build/bin/resonance build/bin/resonance-helper
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" build/packaging/PKGBUILD
          # makepkg refuses to run as root (the container's default user) —
          # a throwaway build user is the standard workaround, and since
          # this PKGBUILD only packages an already-built binary (no
          # --syncdeps, nothing to compile), it needs no sudo access.
          # --nodeps skips makepkg's runtime-dependency check against the
          # pacman database: depends=() here describes what the *installed*
          # package needs on an end user's machine, not this build
          # container, whose pacman database was never synced and has
          # neither webkit2gtk nor gtk3 installed.
          useradd -m builder
          chown -R builder:builder build/
          su builder -c "cd build/packaging && makepkg --noconfirm --nodeps"
          mv build/packaging/*.pkg.tar.zst .

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resonance-arch
          path: "*.pkg.tar.zst"
          retention-days: 1

  release:
    needs: [package-deb, package-arch]
    runs-on: ubuntu-24.04
    # workflow_dispatch is the dry-run trigger: build + both packaging jobs
    # already ran and proved themselves above, but this job — the one that
    # actually touches GitHub Releases — never runs for it.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download .deb artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resonance-deb

      - name: Download Arch package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resonance-arch

      # Every tag from v1.0.0 onward publishes as a normal, full GitHub
      # release; only pre-1.0 (v0.x) tags are marked pre-release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          PRERELEASE_FLAG=""
          case "$REF_NAME" in
            v0.*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$REF_NAME" *.deb *.pkg.tar.zst \
            --title "$REF_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG
